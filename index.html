<!doctype html>
<html lang="de" class="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f59e0b" />
    <meta
      name="description"
      content="Plan – gemeinsam den Haushalt organisieren: Einkaufslisten, Aufgaben, Essensplanung, Budget und Kalender."
    />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <title>Plan – Haushalt organisieren</title>
    <script>
      // Theme früh setzen, um Flackern zu vermeiden
      (function () {
        try {
          const stored = localStorage.getItem("plan-theme");
          const dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
